<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GLASS UI</title>
</head>
<body>
    <style>
        *{margin:0;
            padding:0;
            box-sizing:border-box;
             font-family:'Montserrat',sans-serif; 
}
        body{background-color:rgb(141, 141, 182);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background-image:url("flower1.jpg");
            background-size:cover;
            background-repeat:no-repeat;
            background-size:cover;
        
            
            
        }

        .container{display:flex;
            justify-content:center;
            align-items:center;
            height:400px;
            width:300px;
            
            
        }

        .container .card{
            width:40vw;
            height:400px;
            margin:30px;
            box-shadow:20px 20px 50px rgba(0,0,0,1);
            border-radius:10px;
           display:flex;
           justify-content:center;
           flex-direction:column;
           align-items:center;
            border-top:2px solid 
        rgba(248,248,248,0.8);
        backdrop-filter:blur(4px);

        text-align:center;
       
         } 

        .content{
            width:100%;
            height:100%;
            
            display:flex;
            justify-content:center;
            flex-direction:column;
            align-items:center;
            text-align:center;
            
            
        }

         .text-field{
           width:100%;
           height:45px;
            padding:10px;
            border-radius:5px;
            border:none;
            margin:10px auto 10px;
            font-size:12px;


        } 

        .content input:focus{
            outline:none;
            
            

        }

        .content h1{color:rgb(255,255,255);
            text-shadow: 2px 2px 5px black;
            font-size:1.2rem;
            margin-bottom:40px;

        }

        label{font-size:0.9rem;
            
        
        }

        .form-input{
            width:100%;
           
        
        } 

        .form-input button{width:140px;
        background:rgba(255,255,255,0);
        border:none;
        border:1px solid rgba(2,2,2,0.5);
        padding:10px;
        cursor:pointer;
        border-radius:5px;
        margin:10px auto 10px; 
        }

        .form-input button:hover{background:violet;
        color:white;
        font-weight:bold;
        border:1px solid rgba(225,225,225,1);
        }

        @media(max-width:600px){
            .container .card{
                width:60vw;
            }
        }

         @media(max-width:400px){
            .container .card{
                width:90vw;
            }
        }

         @media(max-width:400px){
            .container .card{
                width:95vw;
            }
        }



        
        


    </style>
    <div class="container">
        <div class="card">
            <div class="content">
                <h1>Please sign in!</h1>
            </div>
            <div class="form-input">
                <input type="text" class="text-field" placeholder="Username or Email">
            </div>
            <div class="form-input">
                <input type="password" class=text-field placeholder="Enter password"
          </div>
          <div class="form-checkbox">
            <input type="checkbox">
            <label>Keep me signed in</label>
          </div>
          <div class="form-input">
            <button>Login</button>
          </div>

        </div>

    </div>

    
</body>
</html>
